# app/security/secrets.yaml

secrets:
  jwt:
    provider: vault
    path: secret/data/phishguard/jwt
    key: jwt_secret

  virustotal:
    provider: aws_secrets_manager
    secret_id: phishguard/virustotal/api_key

  database:
    provider: kubernetes_external_secret
    name: pg-credentials

  encryption:
    provider: vault
    path: secret/data/phishguard/encryption
    key: master_key

runtime:
  cache_ttl_seconds: 300
  fail_secure: true
  refresh_on_start: true
