services:

  phishguard_api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: phishguard_api

    restart: always

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      - redis

    environment:
      - PYTHONPATH=/app
      - ENVIRONMENT=production
      - PYTHONUNBUFFERED=1

    networks:
      - phishguard_net

  redis:
    image: redis:7-alpine

    container_name: phishguard_redis

    restart: always

    command: redis-server --appendonly yes

    volumes:
      - redis_data:/data

    networks:
      - phishguard_net


volumes:
  redis_data:

networks:
  phishguard_net:
