<!-- app/templates/login.html -->

<!DOCTYPE html>
<html>
<head>
    <title>PhishGuard Login</title>

    <link rel="stylesheet" href="/static/css/main.css">
</head>

<body>

<div class="login-container">

    <div class="card">

        <h1>PhishGuard V5</h1>

        <form method="post" action="/login">

            <input
                type="text"
                name="username"
                placeholder="Username"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

    </div>

</div>

</body>
</html>
