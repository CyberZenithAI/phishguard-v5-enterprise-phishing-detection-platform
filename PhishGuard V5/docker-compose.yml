services:

  phishguard_api:

    build:
      context: .
      dockerfile: Dockerfile

    container_name: phishguard_api

    restart: unless-stopped

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      - redis

    volumes:
      - .:/app

    environment:
      - PYTHONPATH=/app
      - ENVIRONMENT=production
      - PYTHONUNBUFFERED=1

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

    networks:
      - phishguard_net

  redis:

    image: redis:7-alpine

    container_name: phishguard_redis

    restart: unless-stopped

    command: redis-server --appendonly yes

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 20s
      timeout: 5s
      retries: 3

    networks:
      - phishguard_net

volumes:
  redis_data:

networks:
  phishguard_net:
