version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: phishguard-redis
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: phishguard-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - redis
    volumes:
      - ./app:/app  # Para hot‑reload en desarrollo

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: phishguard-worker
    env_file:
      - .env
    depends_on:
      - redis
