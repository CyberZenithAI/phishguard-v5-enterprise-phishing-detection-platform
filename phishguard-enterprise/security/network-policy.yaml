apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: phishguard-netpol
spec:
  podSelector:
    matchLabels:
      app: phishguard-api
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: phishguard-worker
    ports:
    - protocol: TCP
      port: 8000
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: redis
    ports:
    - protocol: TCP
      port: 6379
