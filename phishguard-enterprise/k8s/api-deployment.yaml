apiVersion: apps/v1
kind: Deployment
metadata:
  name: phishguard-api
  labels:
    app: phishguard-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: phishguard-api
  template:
    metadata:
      labels:
        app: phishguard-api
    spec:
      containers:
      - name: api
        image: cyberzenithai/phishguard-api:0.9.0
        ports:
        - containerPort: 8000
        env:
        - name: REDIS_URL
          value: "redis://redis-service:6379/0"
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: phishguard-secrets
              key: secret-key
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
spec:
  selector:
    app: phishguard-api
  ports:
  - port: 8000
    targetPort: 8000
  type: LoadBalancer
