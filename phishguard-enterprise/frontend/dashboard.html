<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhishGuard Dashboard</title>
    <style>
        body { background: #0a192f; color: #ccd6f6; font-family: 'Segoe UI', sans-serif; margin: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 20px; background: #112240; border-radius: 12px; margin-bottom: 30px; }
        .header h1 { color: #64ffda; }
        .logout { background: #ff6b6b; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; }
        .panel { background: #112240; border-radius: 12px; padding: 25px; margin-bottom: 20px; }
        .panel h2 { color: #64ffda; margin-bottom: 15px; }
        textarea, input { width: 100%; padding: 10px; margin: 8px 0; background: #0a192f; border: 1px solid #233554; border-radius: 6px; color: #ccd6f6; }
        button { padding: 10px 25px; background: #64ffda; border: none; border-radius: 6px; color: #0a192f; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .result-box { background: #0a192f; padding: 15px; border-radius: 8px; white-space: pre-wrap; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🛡️ PhishGuard Dashboard</h1>
        <button class="logout" onclick="logout()">Cerrar sesión</button>
    </div>

    <!-- Análisis de Dominio -->
    <div class="panel">
        <h2>🔍 Analizar Dominio / URL</h2>
        <input type="text" id="domainUrl" placeholder="https://sospechoso-ejemplo.com/login" value="https://secure-login-verify.tk">
        <button onclick="analyzeDomain()">Analizar</button>
        <div id="domainResult" class="result-box"></div>
    </div>

    <!-- Análisis de Email (gratuito) -->
    <div class="panel">
        <h2>📧 Analizar Correo Electrónico (Raw EML)</h2>
        <textarea id="emailRaw" rows="12" placeholder="Pega aquí el contenido completo del correo (cabeceras + cuerpo)...">From: phishing@malicious.tk
To: victim@company.com
Subject: Urgente: verifique su cuenta
Date: Wed, 21 May 2025 14:00:00 +0000
Message-ID: <abc123@malicious.tk>
MIME-Version: 1.0
Content-Type: text/plain; charset="UTF-8"

Estimado usuario, haga clic aquí para verificar: https://secure-login-verify.tk/update.php</textarea>
        <button onclick="analyzeEmail()">Analizar correo</button>
        <div id="emailResult" class="result-box"></div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        if (!token) window.location.href = '/index.html';

        async function apiCall(url, method = 'GET', body = null) {
            const headers = { 'Authorization': `Bearer ${token}` };
            if (body) headers['Content-Type'] = 'application/json';
            const res = await fetch(url, { method, headers, body: body ? JSON.stringify(body) : undefined });
            if (res.status === 401) { logout(); return; }
            return await res.json();
        }

        async function analyzeDomain() {
            const url = document.getElementById('domainUrl').value;
            const task = await apiCall('/analyze/domain', 'POST', { url });
            document.getElementById('domainResult').textContent = '⏳ Procesando... ID: ' + task.task_id;
            // Polling hasta obtener resultado
            const interval = setInterval(async () => {
                const result = await apiCall(`/analyze/result/${task.task_id}`);
                if (result.status !== 'processing') {
                    clearInterval(interval);
                    document.getElementById('domainResult').textContent = JSON.stringify(result, null, 2);
                }
            }, 1500);
        }

        async function analyzeEmail() {
            const raw_email = document.getElementById('emailRaw').value;
            document.getElementById('emailResult').textContent = '⏳ Analizando correo...';
            const result = await apiCall('/tools/analyze-email', 'POST', { raw_email });
            document.getElementById('emailResult').textContent = JSON.stringify(result, null, 2);
        }

        function logout() {
            localStorage.removeItem('token');
            window.location.href = '/index.html';
        }
    </script>
</body>
</html>
