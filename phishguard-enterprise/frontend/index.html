<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhishGuard Enterprise - Login</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: #0a192f; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-box {
            background: #112240; padding: 40px; border-radius: 12px;
            box-shadow: 0 0 30px rgba(0,255,200,0.2); width: 380px; text-align: center;
        }
        .login-box h1 { color: #64ffda; margin-bottom: 8px; font-size: 28px; }
        .login-box p { color: #8892b0; margin-bottom: 30px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #233554; border-radius: 6px; background: #0a192f; color: #ccd6f6; }
        button { width: 100%; padding: 12px; margin-top: 15px; background: #64ffda; border: none; border-radius: 6px; color: #0a192f; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: #45e0b0; }
        .error { color: #ff6b6b; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>🛡️ PhishGuard</h1>
        <p>Enterprise Anti‑Phishing Platform</p>
        <input type="text" id="username" placeholder="Usuario" value="admin">
        <input type="password" id="password" placeholder="Contraseña" value="phishguard2024">
        <button onclick="login()">Ingresar</button>
        <div id="error" class="error"></div>
    </div>

    <script>
        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            try {
                const res = await fetch('/auth/token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: `username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`
                });
                if (!res.ok) throw new Error('Credenciales inválidas');
                const data = await res.json();
                localStorage.setItem('token', data.access_token);
                window.location.href = '/dashboard.html';
            } catch (e) {
                document.getElementById('error').textContent = e.message;
            }
        }
    </script>
</body>
</html>
